                      weight: 80
                    - name: api-orders-v2-service
                      port: 80
                      weight: 20
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/products"
                  backendRefs:
                    - name: api-products-service
                      port: 80
            ```
