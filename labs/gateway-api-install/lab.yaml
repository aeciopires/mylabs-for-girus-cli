          - "Crie um arquivo chamado 'httproute-mesh-header.yaml'."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: mesh-route-header
            spec:
              parentRefs:
                - name: nginx-gateway
              hostnames:
                - "api-beta.example.com"
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/users"
                      headers:
                        - name: "X-Client-Type"
                          value: "internal"
                  backendRefs:
                    - name: api-users-v2-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/users"
                      headers:
                        - name: "X-Beta-Tester"
                          value: "true"
                  backendRefs:
                    - name: api-users-v2-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/users"
                  backendRefs:
                    - name: api-users-v1-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/orders"
                      headers:
                        - name: "X-Client-Type"
                          value: "internal"
                  backendRefs:
                    - name: api-orders-v2-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/orders"
                  backendRefs:
                    - name: api-orders-v1-service
                      port: 80
            ```
          - "Explicação:"
          - "- Se X-Client-Type=internal -> nova versão (v2)"
          - "- Se X-Beta-Tester=true -> nova versão (v2)"
          - "- Default -> versão estável (v1)"
          - "- Permite testers específicos usar versão beta"
          - "- Útil para A/B testing e feature flags"
