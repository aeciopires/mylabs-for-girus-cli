apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-install
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: gateway-api-install
    title: "Instalação da Gateway API"
    description: "Neste laboratório, vamos instalar os CRDs padrão da Gateway API e um Gateway Controller (Nginx Gateway Fabric)."
    duration: 50m
    timerEnabled: true
    maxDuration: 50m
    image: "linuxtips/girus-kind-single-node:0.1"
    tasks:
      - name: "Instalar os CRDs do Gateway API"
        description: "O Gateway API é baseado em CRDs (Custom Resource Definitions)."
        steps:
          - "O Gateway API é uma especificação para gerenciar gateways de rede no Kubernetes."
          - "Existem várias implementações de Gateway API, e neste laboratório, usaremos o Nginx Gateway Fabric como nosso controlador de gateway."
          - "A página mostra as demais implementações disponíveis: https://gateway-api.sigs.k8s.io/implementations/"
          - "A tabela https://github.com/nginx/nginx-gateway-fabric/tree/main?tab=readme-ov-file#technical-specifications lista as versões do Nginx Gateway Fabric e suas compatibilidades com as versões da Gateway API: https://gateway-api.sigs.k8s.io/implementations/v1.4/."
          - "Os Custom Resource Definitions (CRDs) estendem a API do Kubernetes, permitindo que o Nginx Fabric Gateway funcione corretamente."
          - "O Gateway API define vários CRDs, como GatewayClass, Gateway, HTTPRoute, TCPRoute, entre outros."
          - "A instalação dos CRDs é o primeiro passo para configurar um gateway no Kubernetes."
          - "Instale os CRDs padrão da Gateway API fornecidos pelo Nginx Gateway Fabric."
          - "A versão edge disponível na branch main é compatível com a versão v1.4 da Gateway API."
          - "kubectl kustomize https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.2.1 | kubectl apply -f -"
          - "kubectl apply --server-side -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.2.1/deploy/crds.yaml"
          - "Verifique se os CRDs foram instalados corretamente com o seguinte comando."
          - "kubectl get crds | grep gateway"
      - name: "Instalar o Nginx Gateway Controller"
        description: "Agora que os CRDs da Gateway API estão instalados, vamos instalar o Nginx Gateway Controller."
        steps:
          - "O Nginx Gateway Controller é responsável por gerenciar os recursos da Gateway API e configurar o Nginx como um gateway."
          - "Instale o Nginx Gateway Controller (no modo NodePort) usando o seguinte comando."
          - "kubectl apply -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.2.1/deploy/nodeport/deploy.yaml"
          - "Verifique os pods no namespace do Nginx Gateway para garantir que o controller está em execução."
          - "kubectl get pods -n nginx-gateway"
          - "Verifique os logs do Nginx Gateway Controller para garantir que não há erros."
          - "kubectl logs -n nginx-gateway -l app.kubernetes.io/name=nginx-gateway"
          - "Outras opções de instalação estão disponíveis na documentação oficial:"
          - "- https://docs.nginx.com/nginx-gateway-fabric/install/manifests/"
          - "- https://docs.nginx.com/nginx-gateway-fabric/install/helm/"
          - "- https://artifacthub.io/packages/helm/nginx-gateway-fabric/nginx-gateway-fabric"
          - "Na página a seguir você encontra mais detalhes sobre o Nginx Gateway Fabric e de troubleshooting:"
          - "- https://docs.nginx.com/nginx-gateway-fabric/troubleshooting/"
          - "- https://github.com/nginx/nginx-gateway-fabric/"
      - name: "Criando o Gateway"
        description: "Agora que o Nginx Gateway Controller está instalado, vamos criar um Gateway simples."
        steps:
          - "Utilize o vim ou nano para criar o arquivo seguinte."
          - "Instale com o seguinte comando."
          - "apk add vim nano"
          - "Crie um arquivo YAML chamado gateway.yaml com o seguinte conteúdo."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1beta1
            kind: Gateway
            metadata:
              name: nginx-gateway
            spec:
              gatewayClassName: nginx
              listeners:
                - name: http
                  protocol: HTTP
                  port: 80
            ```
          - "Explicação:"
          - "- gatewayClassName: Define que estamos utilizando a classe de gateway do Nginx."
          - "- Listeners: Configura um listener na porta 80 para tráfego HTTP."
          - "Aplique a configuração para criar o Gateway."
          - "kubectl apply -f gateway.yaml"
          - "Verifique se o Gateway foi criado corretamente."
          - "kubectl get gateways"
          - "kubectl describe gateway nginx-gateway"
          - "Se na coluna PROGRAMED estiver como True, a configuração funcionou."
          - "Isso irá configurar o Nginx Gateway a nível de namespace e é possível criar outros gateways adicionais por namespace conforme necessário."
          - "Liste os serviços no namespace nginx-gateway para encontrar o IP e a porta do gateway."
          - "kubectl get svc -A"
          - "Anote o IP do nó (NODE-IP) do serviço nginx-gateway-nginx."
          - "Teste o gateway acessando o IP e a porta anotados no navegador ou usando curl."
          - "curl http://NODE-IP:80"
          - "Você deve ver uma resposta padrão do Nginx (404 Not Found), indicando que o gateway está funcionando corretamente, mas não encontrou uma rota configurada."
      - name: "Configurando um HTTPRoute"
        description: "Agora que o Nginx Gateway está criado, vamos configurar um HTTPRoute simples para duas aplicações."
        steps:
          - "Crie um arquivo YAML chamado deploy-apps.yaml com o seguinte conteúdo referente a duas aplicações."
          - |
            ```
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app1
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: app1
              template:
                metadata:
                  labels:
                    app: app1
                spec:
                  containers:
                    - name: app1
                      image: hashicorp/http-echo
                      args:
                        - "-text=This is the APP1"
                      ports:
                        - containerPort: 5678
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: app1-service
            spec:
              selector:
                app: app1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 5678
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app2
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: app2
              template:
                metadata:
                  labels:
                    app: app2
                spec:
                  containers:
                    - name: app2
                      image: hashicorp/http-echo
                      args:
                        - "-text=This is the APP2"
                      ports:
                        - containerPort: 5678
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: app2-service
            spec:
              selector:
                app: app2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 5678
            ```
          - "Explicação:"
          - "- Cria dois Deployments (app1 e app2) com 2 réplicas cada."
          - "- Cada aplicação utiliza a imagem hashicorp/http-echo que retorna uma mensagem HTTP simples."
          - "- Cria dois Services (app1-service e app2-service) para expor as aplicações."
          - "Aplique a configuração para criar os Deployments e Services."
          - "kubectl apply -f deploy-apps.yaml"
          - "Verifique se os pods e serviços foram criados corretamente."
          - "kubectl get pods,svc"
          - "Agora, crie um arquivo YAML chamado httproute.yaml com o seguinte conteúdo para definir as rotas HTTP."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1beta1
            kind: HTTPRoute
            metadata:
              name: app1-app2-route
            spec:
              parentRefs:
                - name: nginx-gateway
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/app1"
                  backendRefs:
                    - name: app1-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/app2"
                  backendRefs:
                    - name: app2-service
                      port: 80
            ```
          - "Explicação:"
          - "- parentRefs: Refere-se ao Gateway que criamos anteriormente (nginx-gateway)."
          - "- rules: Define duas regras de roteamento."
          - "- A primeira regra roteia o tráfego com o prefixo /app1 para o serviço app1-service."
          - "- A segunda regra roteia o tráfego com o prefixo /app2 para o serviço app2-service."
          - "Aplique a configuração para criar o HTTPRoute."
          - "kubectl apply -f httproute.yaml"
          - "Verifique se o HTTPRoute foi criado corretamente."
          - "kubectl get httproutes"
          - "kubectl describe httproute app1-app2-route"
          - "Teste as rotas configuradas acessando os caminhos /app1 e /app2 no gateway."
          - "curl http://NODE-IP:80/app1"
          - "Você deve ver a resposta: This is the APP1"
          - "curl http://NODE-IP:80/app2"
          - "Você deve ver a resposta: This is the APP2"
          - "Parabéns! Você configurou com sucesso a Gateway API com o Nginx Gateway Fabric e criou rotas HTTP para duas aplicações diferentes."
          - "Mais informações sobre o gateway API e o Nginx Gateway Fabric podem ser encontradas na documentação oficial:"
          - "- https://gateway-api.sigs.k8s.io/"
          - "- https://docs.nginx.com/nginx-gateway-fabric/"
          - "Você pode expandir essa configuração adicionando mais rotas, serviços e personalizando o comportamento do gateway conforme necessário."
