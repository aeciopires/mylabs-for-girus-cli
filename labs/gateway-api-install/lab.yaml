apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-install
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: gateway-api-install
    title: "Instalação da Gateway API"
    description: "Neste laboratório, vamos instalar os CRDs padrão da Gateway API, usando o Nginx Gateway Fabric como GatewayController e conhecer algumas das funcionalidades."
    duration: 300m
    timerEnabled: true
    maxDuration: 300m
    image: "linuxtips/girus-kind-single-node:0.1"
    tasks:
      - name: "Instalar os CRDs do Gateway API"
        description: "O Gateway API é baseado em CRDs (Custom Resource Definitions)."
        steps:
          - "Este laboratório é um complemento à teoria apresentada nas páginas abaixo:"
          - "- https://blog.aeciopires.com/conhecendo-o-kubernetes-gateway-api/"
          - "- https://blog.aeciopires.com/aprendendo-kubernetes-gateway-api-na-pratica-com-o-girus-cli/"
          - "O Gateway API é uma especificação para gerenciar gateways de rede no Kubernetes."
          - "Existem várias implementações de Gateway API, e neste laboratório, usaremos o Nginx Gateway Fabric como nosso controlador de gateway (GatewayController)."
          - "Os outros softwares que implementam o GatewayController e podem ser encontrados em: https://gateway-api.sigs.k8s.io/implementations/"
          - "Os links abaixo fornecem mais informações sobre o Nginx Gateway Fabric:"
          - "- Tabela de compatibilidade dos CRDs: https://docs.nginx.com/nginx-gateway-fabric/overview/gateway-api-compatibility/"
          - "- Tabela de versões: https://github.com/nginx/nginx-gateway-fabric/tree/main?tab=readme-ov-file#technical-specifications"
          - "- Especificações do Gateway API: https://gateway-api.sigs.k8s.io/implementations/v1.4/"
          - "- Documentação do Kubernetes Gateway API: https://gateway-api.sigs.k8s.io/"
          - "- Documentação do Nginx Gateway Fabric: https://docs.nginx.com/nginx-gateway-fabric/"
          - "Os Custom Resource Definitions (CRDs) estendem a API do Kubernetes, permitindo que o Nginx Gateway Fabric funcione corretamente."
          - "O Gateway API define vários CRDs, como GatewayClass, Gateway, HTTPRoute, TCPRoute, entre outros."
          - "A instalação dos CRDs é o primeiro passo para configurar um gateway no Kubernetes."
          - "Instale os CRDs padrão da Gateway API fornecidos pelo Nginx Gateway Fabric."
          - "A versão edge disponível na branch 'main' é compatível com a versão 'v1.4' da Gateway API."
          - |
            ```
            kubectl kustomize https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.2.1 | kubectl apply -f -
            ```
          - |
            ```
            kubectl apply --server-side -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.2.1/deploy/crds.yaml
            ```
          - "Verifique se os CRDs foram instalados corretamente com o seguinte comando."
          - |
            ```
            kubectl get crds | grep gateway
            ```

      - name: "Instalar o Nginx Gateway Controller"
        description: "Agora que os CRDs da Gateway API estão instalados, vamos instalar o Nginx Gateway Fabric."
        steps:
          - "O Nginx Gateway Fabric implementa o GatewayController e é responsável por gerenciar os recursos da Gateway API."
          - "Instale-o no modo NodePort usando o seguinte comando."
          - |
            ```
            kubectl apply -f https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.2.1/deploy/nodeport/deploy.yaml
            ```
          - "Verifique os objetos criados no namespace do 'nginx-gateway'."
          - |
            ```
            kubectl get all -n nginx-gateway
            ```
          - "Verifique detalhes do deployment do 'nginx-gateway' no namespace 'nginx-gateway'."
          - |
            ```
            kubectl describe deployment nginx-gateway -n nginx-gateway
            ```
          - "Observe na seção Args que o controller está sendo configurado para criar a 'gatewayclass=nginx'. Falaremos sobre ela mais adiante."
          - "Verifique os pods no namespace do 'nginx-gateway' para garantir que o GatewayController está em execução."
          - |
            ```
            kubectl get pods -n nginx-gateway
            ```
          - "Você deve ver os pods do Nginx Gateway em estado 'Running'."
          - "Verifique os logs para garantir que não há erros."
          - |
            ```
            kubectl logs -l app.kubernetes.io/name=nginx-gateway -n nginx-gateway 
            ```
          - "Outras opções de instalação estão disponíveis na documentação oficial:"
          - "- Usando manifests: https://docs.nginx.com/nginx-gateway-fabric/install/manifests/"
          - "- Usando o helm:"
          - "  - https://docs.nginx.com/nginx-gateway-fabric/install/helm/"
          - "  - https://artifacthub.io/packages/helm/nginx-gateway-fabric/nginx-gateway-fabric"
          - "Na página a seguir você encontra mais detalhes sobre o Nginx Gateway Fabric e sobre como fazer o troubleshooting:"
          - "- https://docs.nginx.com/nginx-gateway-fabric/troubleshooting/"
          - "- https://github.com/nginx/nginx-gateway-fabric/"

      - name: "Criando o Gateway"
        description: "Agora que o Nginx Gateway Fabric está instalado, vamos criar um gateway simples."
        steps:
          - "Instale os editores de texto 'vim' e 'nano' com o seguinte comando."
          - |
            ```
            apk add vim nano
            ```
          - "Crie um arquivo YAML chamado 'gateway.yaml'."
          - "Utilize o 'vim' ou 'nano' para criar/editar os arquivos conforme o seu critério e conhecimento. Exemplo:"
          - |
            ```
            vim gateway.yaml

            # Ou:

            nano gateway.yaml
            ```
          - "Adicione o seguinte conteúdo ao arquivo."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1beta1
            kind: Gateway
            metadata:
              name: nginx-gateway
            spec:
              gatewayClassName: nginx
              listeners:
                - name: http
                  protocol: HTTP
                  port: 80
            ```
          - "Explicação:"
          - "- 'gatewayClassName': Define que estamos utilizando a classe de gateway do 'nginx', criado no exercício anterior."
          - "- 'listeners': Configura um listener na porta 80 para receber o tráfego HTTP."
          - "Você pode obter mais informações sobre o recurso Gateway com os comandos abaixo:"
          - |
            ```
            kubectl explain gateway
            kubectl explain gateway.spec
            kubectl explain gateway.spec.listeners
            ```
          - "Aplique a configuração para criar o Gateway."
          - |
            ```
            kubectl apply -f gateway.yaml
            ```
          - "Verifique se o Gateway foi criado corretamente."
          - |
            ```
            kubectl get gateways
            ```
          - "Se na coluna PROGRAMED estiver como True, a configuração funcionou."
          - "Veja mais detalhes do Gateway criado."
          - |
            ```
            kubectl describe gateway nginx-gateway
            ```
          - "Essa ação também cria os objetos: service, deployment, pod e replicaset do GatewayController no namespace 'nginx-gateway'. Verifique os recursos criados com o comando abaixo."
          - |
            ```
            kubectl get all -n nginx-gateway
            ```
          - "Esse gateway faz uso do GatewayClass 'nginx'."         
          - "GatewayClass define a implementação do controlador de gateway (neste caso, é o Nginx Gateway Fabric)."
          - "A configuração do GatewayClass 'nginx' é definida a nível de cluster."
          - "O GatewayClass 'nginx' foi criado durante a instalação do Nginx Gateway Fabric."
          - "Verifique o criação do objeto GatewayClass 'nginx'."
          - |
            ```
            kubectl get gatewayclass
            ```
          - "Veja mais detalhes do GatewayClass 'nginx'."
          - |
            ```
            kubectl describe gatewayclass nginx
            ```
          - "Os Gateways são CRDs namespace-scoped, ou seja, são criados dentro de um namespace específico e fazem uso do GatewayClass."
          - "Neste caso, o Gateway 'nginx-gateway' foi criado no namespace padrão deste laboratório: 'lab-test-user'."
          - "Você pode usar o comando abaixo para verificar que foi criado um deployment chamado 'nginx-gateway-nginx' no namespace 'lab-test-user'. Esse deployment é uma a instância do CRD Gateway criado anteriormente."
          - |
            ```
            kubectl get deployments -n lab-test-user
            ```
          - "Veja mais detalhes deste deployment."
          - |
            ```
            kubectl describe deployment nginx-gateway-nginx -n lab-test-user
            ```
          - "Você pode verificar que um pod associado ao 'nginx-gateway-nginx' foi criado no namespace 'lab-test-user' com o seguinte comando:"
          - |
            ```
            kubectl get pods -n lab-test-user
            ```
          - "Veja mais detalhes do pod gateway com o seguinte comando."
          - |
            ```
            kubectl describe pod POD_NAME -n lab-test-user
            ```
          - "OBS.: É possível criar outros gateways por namespace conforme necessário."
          - "Liste os serviços no namespace 'lab-test-user' para encontrar o IP e a porta do gateway."
          - |
            ```
            kubectl get service -n lab-test-user
            ```
          - "Na coluna ClusterIP, observe o IP do serviço 'nginx-gateway-nginx', que é do tipo NodePort e também as portas na coluna protocolos."
          - "Isso significa que o gateway está pronto para receber tráfego HTTP na porta 80."
          - "Se você perceber, é o mesmo IP do 'nginx-gateway' mostrado no comando a seguir."
          - |
            ```
            kubectl get gateways nginx-gateway -o jsonpath='{.status.addresses[0].value}'
            ```
          - "Crie uma variável de ambiente para receber esse IP e facilitar os próximos comandos."
          - |
            ```
            export GATEWAY_IP=$(kubectl get service nginx-gateway-nginx -n lab-test-user -o jsonpath='{.spec.clusterIP}')

            echo $GATEWAY_IP
            ```
          - "Teste o gateway acessando o IP e a porta usando curl."
          - |
            ```
            curl http://$GATEWAY_IP:80
            ```
          - "Você deve ver uma resposta padrão do Nginx (404 Not Found), indicando que o gateway está funcionando corretamente, mas não encontrou uma rota configurada."
          - "Usando o comando abaixo, você pode verificar quais os recursos que o gateway 'nginx-gateway' suporta."
          - |
            ```
            # Instalando o jq
            apk add jq

            # Obtendo os recursos suportados pelo gateway
            kubectl get gateways nginx-gateway -o jsonpath='{.status.listeners[0].supportedKinds}' | jq
            ```
          - "Isso indica que o gateway suporta recursos do tipo HTTPRoute e GRPCRoute."
          - "Você pode obter mais informações sobre estes recursos suportados com os comandos abaxo:"
          - |
            ```
            kubectl explain httproute
            kubectl explain httproute.spec
            kubectl explain httproute.spec.rules
            kubectl explain httproute.spec.rules.backendRefs
            kubectl explain httproute.spec.rules.matches
            kubectl explain httproute.spec.rules.filters

            kubectl explain grpcroute
            kubectl explain grpcroute.spec
            kubectl explain grpcroute.spec.rules
            kubectl explain grpcroute.spec.rules.backendRefs
            kubectl explain grpcroute.spec.rules.matches
            kubectl explain grpcroute.spec.rules.filters
            ```
          - "Nas próximas seções, você aprenderá a configurar rotas para esses e outros dos recursos do Gateway API."
          - "Parabéns! Você criou com sucesso um Gateway usando o Nginx Gateway Fabric."

      - name: "Configurando um HTTPRoute"
        description: "Agora que o Nginx Gateway está criado, vamos configurar um HTTPRoute simples para duas aplicações."
        steps:
          - "Crie um arquivo YAML chamado 'deploy-apps.yaml' com o seguinte conteúdo referente a duas aplicações."
          - |
            ```
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app1
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: app1
              template:
                metadata:
                  labels:
                    app: app1
                spec:
                  containers:
                    - name: app1
                      image: hashicorp/http-echo
                      args:
                        - "-text=This is the APP1"
                      ports:
                        - containerPort: 5678
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: app1-service
            spec:
              selector:
                app: app1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 5678
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app2
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: app2
              template:
                metadata:
                  labels:
                    app: app2
                spec:
                  containers:
                    - name: app2
                      image: hashicorp/http-echo
                      args:
                        - "-text=This is the APP2"
                      ports:
                        - containerPort: 5678
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: app2-service
            spec:
              selector:
                app: app2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 5678
            ```
          - "Explicação:"
          - "- Cria dois Deployments ('app1' e 'app2') com 2 réplicas ou pods cada."
          - "- Cada aplicação utiliza a imagem 'hashicorp/http-echo' que retorna uma mensagem HTTP simples."
          - "- Cria dois Services ('app1-service' e 'app2-service') para expor as aplicações."
          - "Aplique a configuração para criar os Deployments e Services."
          - |
            ```
            kubectl apply -f deploy-apps.yaml
            ```
          - "Verifique se os pods e serviços foram criados corretamente."
          - |
            ```
            kubectl get pods,svc -n lab-test-user
            ```
          - "Agora, crie um arquivo YAML chamado 'httproute.yaml' com o seguinte conteúdo para definir as rotas HTTP."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1beta1
            kind: HTTPRoute
            metadata:
              name: app1-app2-route
            spec:
              parentRefs:
                - name: nginx-gateway
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/app1"
                  backendRefs:
                    - name: app1-service
                      port: 80
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/app2"
                  backendRefs:
                    - name: app2-service
                      port: 80
            ```
          - "Explicação:"
          - "- 'parentRefs': Refere-se ao Gateway que criamos anteriormente ('nginx-gateway')."
          - "- 'rules': Define duas regras de roteamento."
          - "- A primeira regra roteia o tráfego com o prefixo '/app1' para o serviço 'app1-service'."
          - "- A segunda regra roteia o tráfego com o prefixo '/app2' para o serviço 'app2-service'."
          - "Aplique a configuração para criar o HTTPRoute."
          - |
            ```
            kubectl apply -f httproute.yaml
            ```
          - "Verifique se o HTTPRoute foi criado corretamente."
          - |
            ```
            kubectl get httproute -n lab-test-user
            ```
          - |
            ```
            kubectl describe httproute app1-app2-route -n lab-test-user
            ```
          - "Teste as rotas configuradas acessando os paths '/app1' e '/app2' no gateway."
          - |
            ```
            curl http://$GATEWAY_IP:80/app1
            ```
          - |
            ```
            curl http://$GATEWAY_IP:80/app2
            ```
          - "Você deve ver as respostas específicas de cada aplicação."
          - "Se você receber as respostas corretas, significa que o Nginx Gateway está roteando o tráfego corretamente para as duas aplicações com base nas rotas definidas."
          - "Verifique os logs do Nginx Gateway Controller para monitorar o tráfego e garantir que as requisições estão sendo processadas corretamente."
          - |
            ```
            kubectl logs -l app.kubernetes.io/name=nginx-gateway -n nginx-gateway 
            ```
          - |
            ```
            kubectl logs -l app.kubernetes.io/name=nginx-gateway-nginx -n lab-test-user
            ```
          - "Verifique também os logs dos pods das aplicações para garantir que estão recebendo as requisições."
          - |
            ```
            kubectl logs -l app=app1 -n lab-test-user
            ```
          - |
            ```
            kubectl logs -l app=app2 -n lab-test-user
            ```
          - "Parabéns! Você configurou com sucesso a Gateway API com o Nginx Gateway Fabric e criou rotas HTTP para duas aplicações diferentes."

      - name: "Entendendo o HTTPRoute"
        description: "HTTPRoute é um recurso da Gateway API para rotear tráfego HTTP/HTTPS"
        steps:
          - "HTTPRoute é um CRD (Custom Resource Definition) que define como rotear o tráfego HTTP/HTTPS para serviços de backend."
          - "HTTPRoute permite roteamento baseado em:"
          - "- Caminho (Path): /api, /usuarios, etc"
          - "- Host/Hostname: exemplo.com.br, api.exemplo.com.br"
          - "- Headers: X-Custom-Header, Authorization, etc"
          - "- Query parameters: ?versao=v2"
          - "- Métodos HTTP: GET, POST, PUT, DELETE, etc"
          - "Documentação oficial: https://gateway-api.sigs.k8s.io/api-types/httproute/"
          - "No exercício anterior você criou um HTTPRoute simples que roteia o tráfego baseado em path (/app1 e /app2)."
          - "Agora, vamos explorar mais exemplos avançados de HTTPRoute."
          - "Crie um arquivo YAML chamado 'httproute-header.yaml'."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: api-route-header
            spec:
              parentRefs:
                - name: nginx-gateway
              rules:
                - matches:
                    - headers:
                        - name: "X-API-Version"
                          value: "v1"
                  backendRefs:
                    - name: app1-service
                      port: 80
                - matches:
                    - headers:
                        - name: "X-API-Version"
                          value: "v2"
                  backendRefs:
                    - name: app2-service
                      port: 80
            ```
          - "Explicação:"
          - "- Essa HTTPRoute roteia baseado no valor do header 'X-API-Version'"
          - "- Se na requisição for passado o header 'X-API-Version=v1', ela será encaminhada pelo gateway para o serviço 'app1-service'"
          - "- Se for passado o header 'X-API-Version=v2', vai ser encaminhada para o serviço 'app2-service'"
          - "- O path não é considerado nesse exemplo, apenas o header. Logo, todas as requisições serão feitas no path '/', que é o padrão."
          - "Aplique a configuração:"
          - |
            ```
            kubectl apply -f httproute-header.yaml
            ```
          - "Verifique todas as HTTPRoutes criadas:"
          - |
            ```
            kubectl get httproute -n lab-test-user
            ```
          - |
            ```
            kubectl describe httproute api-route-header -n lab-test-user
            ```
          - "Teste o roteamento baseado em headers usando curl:"
          - |
            ```
            curl -H "X-API-Version: v1" http://$GATEWAY_IP:80/
            ```
          - |
            ```
            curl -H "X-API-Version: v2" http://$GATEWAY_IP:80/
            ```
          - "Você deve ver respostas diferentes baseadas no header 'X-API-Version'."
          - "Verifique os logs do gateway e das aplicações:"
          - |
            ```
            kubectl logs -l app.kubernetes.io/name=nginx-gateway-nginx -n lab-test-user
            ```
          - "Verifique também os logs dos pods das aplicações para garantir que estão recebendo as requisições."
          - |
            ```
            kubectl logs -l app=app1 -n lab-test-user
            ```
          - |
            ```
            kubectl logs -l app=app2 -n lab-test-user
            ```
          - "Agora, vamos criar um HTTPRoute que faz roteamento baseado em pesos (load balancing)."
          - "Crie um arquivo YAML chamado 'httproute-weighted.yaml'."
          - |
            ```
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: api-route-weighted
            spec:
              parentRefs:
                - name: nginx-gateway
              hostnames:
                - "weighted-api.local"
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: "/api"
                  backendRefs:
                    - name: app1-service
                      port: 80
                      weight: 90
                    - name: app2-service
                      port: 80
                      weight: 10
            ```
          - "Explicação:"
          - "- 'weighted-api.local' é o hostname para essa rota que você informará num header 'Host' nas requisições usando o comando 'curl'."
          - "- Roteia o tráfego com path '/api' entre dois backends com pesos diferentes."
          - "- Essa HTTPRoute distribui o tráfego entre dois backends"
          - "- 90% do tráfego vai para o serviço 'app1-service' (simulando uma versão estável)"
          - "- 10% do tráfego vai para o serviço 'app2-service' (simulando uma versão canary)"
          - "- Isso é útil para testes de canary deployment"
          - "Aplique a configuração:"
          - |
            ```
            kubectl apply -f httproute-weighted.yaml
            ```
          - "Verifique todas as HTTPRoutes criadas:"
          - |
            ```
            kubectl get httproute -n lab-test-user
            ```
          - |
            ```
            kubectl describe httproute api-route-weighted -n lab-test-user
            ```
          - "Teste a HTTPRoute com pesos (execute várias vezes):"
          - |
            ```
            curl -H "Host: weighted-api.local" http://$GATEWAY_IP:80/api
            ```
          - "Você deve ver principalmente respostas da v1 com ocasionalmente respostas da v2"
          - "Verifique os logs do gateway e das aplicações:"
          - |
            ```
            kubectl logs -l app.kubernetes.io/name=nginx-gateway-nginx -n lab-test-user
            ```
          - "Verifique também os logs dos pods das aplicações para garantir que estão recebendo as requisições."
          - |
            ```
            kubectl logs -l app=app1 -n lab-test-user
            ```
          - |
            ```
            kubectl logs -l app=app2 -n lab-test-user
            ```
          - "Perceba que nos logs você verá mais requisições chegando no 'app1' do que no 'app2', refletindo os pesos configurados."
          - "O HTTPRoute suporta diversos tipos de match:"
          - "- PathPrefix: Prefixo do caminho (/api, /users, etc)"
          - "- Exact: Caminho exato (/api/users, etc)"
          - "- RegularExpression: Expressão regular"
          - "- Headers: Valores de headers HTTP"
          - "- QueryParams: Parâmetros de query (?key=value)"
          - "- Method: Método HTTP (GET, POST, etc)"
          - "Documentação: https://kubernetes.io/docs/concepts/services-networking/gateway/"
          - "Referência completa da API: https://gateway-api.sigs.k8s.io/references/spec/"
          - "Mais exemplos disponíveis em:"
          - "- https://docs.nginx.com/nginx-gateway-fabric/traffic-management/"
          - "- https://github.com/nginx/nginx-gateway-fabric/tree/main/examples"
          - "Você completou este laboratório com sucesso!"

      - name: "Entender o HTTPRoute for Mesh"
        description: "HTTPRoute com roteamento avançado para microsserviços"
        steps:
          - "HTTPRoute for Mesh refere-se ao uso de HTTPRoute em arquiteturas de microsserviços complexas."
          - "Não é um tipo separado, mas sim HTTPRoute configurado para cenários mesh/service."
          - "Recursos avançados de HTTPRoute para mesh:"
          - "- Roteamento por múltiplos critérios (path + header + method)"
          - "- Load balancing com pesos entre versões"
          - "- Canary deployments"
          - "- Traffic splitting"
          - "- Circuit breakers e timeouts"
          - "- Rate limiting"
          - "HTTPRoute é fundamental para:"
          - "- Ingress control com roteamento inteligente"
          - "- Canary deployments"
          - "- A/B testing"
          - "- Traffic management"
          - "- API gateways"
          - "Documentação: https://gateway-api.sigs.k8s.io/guides/traffic-splitting/"
          - "Para simular uma malha de microsserviços, criaremos vários serviços com diferentes versões."
          - "Crie um arquivo chamado 'mesh-services-deploy.yaml'."
          - |
            ```
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: api-users-v1
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: api-users
                  version: v1
              template:
                metadata:
